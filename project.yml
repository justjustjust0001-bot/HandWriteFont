name: FontMaker
options:
  bundleIdPrefix: com.fontmaker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  FontMaker:
    type: application
    platform: iOS
    sources:
      - path: HandWriteFont
        excludes:
          - Resources/**
          - Products.storekit
      - path: HandWriteFont/Resources
        buildPhase: resources
      - path: HandWriteFont/Products.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fontmaker.app
        PRODUCT_NAME: FontMaker
        INFOPLIST_KEY_CFBundleDisplayName: FontMaker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UILaunchScreen_ImageName: Logo
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES

schemes:
  FontMaker:
    build:
      targets:
        FontMaker: all
    run:
      config: Debug
      storeKitConfiguration: HandWriteFont/Products.storekit
